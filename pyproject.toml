[project]
name = "ledgerflow"
version = "0.1.0"
description = "Multi-tenant expense approval SaaS built with Django and DRF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "drf-spectacular>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerflow"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ledgerflow.config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=ledgerflow --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["ledgerflow"]
omit = ["*/migrations/*", "*/config/*", "*/manage.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
packages = ["ledgerflow"]

[tool.django-stubs]
django_settings_module = "ledgerflow.config.settings.test"
